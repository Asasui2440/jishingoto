<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>保存したマップ | ジシンゴト！</title><link rel="stylesheet" href="./vendor/maplibre-gl.css"><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="/brand/symbol-v6.png" type="image/png"></head>
<body><header class="header"><div class="header-brand"><button id="go-back" class="header-back" type="button" aria-label="戻る" title="ひとつ前の画面へ戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg><span>戻る</span></button><span class="header-name">ジシンゴト<span> / 保存したマップ</span></span></div><span id="connection" class="badge">通信確認中</span><a class="home-link" href="/home" aria-label="トップページへ戻る" title="トップページへ戻る"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></a></header>
<main>
<section class="intro"><span class="eyebrow">電波がなくても、地図はここに。</span><h1>もしものときの、<br>道しるべ。</h1><div class="offline-benefit"><strong>オフラインでも、<br class="mobile-break">地図と現在地を確認。</strong><p>保存した地図・経路を開き、位置情報で今いる場所を表示できます。</p></div></section>
<div id="message" class="message" role="status" aria-live="polite" hidden></div>
<section class="saved-section" aria-labelledby="saved-title"><div class="section-heading"><h2 id="saved-title">保存したマップ</h2></div><div id="saved-list"><p>読み込み中…</p></div></section>
<section id="report-save" hidden><p id="report-status" role="status">リザルトの避難先を読み込んでいます…</p><button id="report-retry" hidden>もう一度読み込む</button></section>
<section id="workspace" hidden>
<div class="section-heading"><h2 id="workspace-title">避難先</h2><button id="close-workspace">マップ一覧へ</button></div>
<div id="saved-info" class="small" hidden></div>
<div class="map-wrap"><div id="map" class="map" tabindex="0" role="application" aria-label="保存した道路地図。現在地と避難先までの経路を表示します。"></div><p id="map-loading" class="map-loading" role="status" hidden>地図を読み込み中…</p><div class="map-controls"><button id="zoom-in" aria-label="地図を拡大">＋</button><button id="zoom-out" aria-label="地図を縮小">−</button><button id="fit-route">全体</button></div><span class="north" aria-hidden="true">↑ 北</span><div class="attribution"><a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · <a href="https://openmaptiles.org" target="_blank" rel="noopener">© OpenMapTiles</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div></div>
<div class="location-tools"><button id="locate" class="primary">◎ 現在地を表示</button><span id="location-status" class="small">ボタンを押すと現在地を表示・更新します。</span></div>
<div id="report-actions" hidden><p id="report-distance" class="small"></p><button id="report-download" class="primary save" disabled>このマップと避難所を保存する</button><progress id="report-progress" hidden></progress><p class="preview-caption">保存用の道路地図では、体験時と道順が異なる場合があります。</p></div>
<div id="route-details" hidden><p id="route-summary" class="info"></p><div id="offline-navigation" class="navigation-actions"><button id="route-from-location" class="primary">現在地からこの避難所へ</button></div><details id="route-memo" hidden><summary>メモ</summary><p id="route-notes" class="notes"></p></details></div>
</section>
</main><noscript>この機能にはJavaScriptが必要です。</noscript><script type="module" src="./app.mjs"></script></body></html>
